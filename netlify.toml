# Netlify configuration for Puremix.ai frontend (React + Vite)
#
# IMPORTANT: This config deploys the FRONTEND ONLY.
# The Express API server must be deployed separately (Railway, Render, Fly.io, etc.)
# and its URL set as VITE_API_BASE_URL in the Netlify environment.

[build]
  base    = "."
  command = "pnpm --filter @workspace/music-mastering run build"
  publish = "artifacts/music-mastering/dist/public"

[build.environment]
  NODE_VERSION  = "20"
  PNPM_VERSION  = "9"
  BASE_PATH     = "/"

# SPA redirect: all routes → index.html so Wouter client-side routing works
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# Long cache for hashed static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
