kind = "web"
previewPath = "/"
title = "AI Music Mastering"
version = "1.0.0"
id = "artifacts/music-mastering"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 8080

[services.development]
run = "sleep infinity"

[services.production]
build = [ "pnpm", "--filter", "@workspace/music-mastering", "run", "build" ]
publicDir = "artifacts/music-mastering/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5174"
BASE_PATH = "/"
